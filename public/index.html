<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaarpBuild</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #111;
      background: #fff;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 70px 24px;
    }

    .hero {
      text-align: center;
      padding: 40px 0 80px;
    }

    h1 {
      font-size: 52px;
      margin: 0 0 14px;
    }

    .hero p {
      color: #555;
      font-size: 20px;
      margin: 0 0 28px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #111;
      background: #111;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    .join {
      background: #fff;
      color: #111;
    }

    #community-projects {
      border-top: 1px solid #ddd;
      padding-top: 45px;
    }

    #community-projects h2 {
      font-size: 32px;
      margin: 0 0 8px;
    }

    #community-projects > p {
      color: #666;
      margin-bottom: 25px;
    }

    #server {
      width: 100%;
      min-height: 500px;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }

    #server iframe {
      width: 100%;
      height: 700px;
      border: 0;
    }

    .status {
      padding: 30px;
      color: #666;
    }

    footer {
      margin-top: 70px;
      padding-top: 25px;
      border-top: 1px solid #ddd;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main>

    <section class="hero">
      <h1>WaarpBuild</h1>
      <p>Build <b>apps</b> with WaarpBuild.</p>

      <div class="buttons">
        <a href="https://waarpbuild.vercel.app">
          <button>Start creating</button>
        </a>

        <a href="https://waarpbuild.vercel.app/login/">
          <button class="join">⚡ Join</button>
        </a>
      </div>
    </section>

    <section id="community-projects">
      <h2>Community Projects</h2>
      <p>Projects and server content from the WaarpBuild server repository.</p>

      <div id="server">
        <div class="status">Loading WaarpBuild server...</div>
      </div>
    </section>

    <footer>
      WaarpBuild
    </footer>

  </main>

  <script>
    async function loadServer() {
      const container = document.getElementById("server");

      try {
        const response = await fetch(
          "https://github.com/waarpbuild/server/"
        );

        if (!response.ok) {
          throw new Error("GitHub returned " + response.status);
        }

        const html = await response.text();

        const iframe = document.createElement("iframe");
        iframe.srcdoc = html;

        container.innerHTML = "";
        container.appendChild(iframe);
      } catch (error) {
        console.error(error);

        container.innerHTML = `
          <div class="status">
            Unable to load the WaarpBuild server repository.
          </div>
        `;
      }
    }

    loadServer();
  </script>

</body>
</html>
